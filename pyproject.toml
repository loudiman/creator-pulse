[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creatorpulse"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gspread==6.2.1",
    "discord.py==2.7.1",
    "playwright==1.61.0",
    "PyYAML==6.0.3",
    "requests==2.34.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.0",
    "mypy==2.3.0",
]

[project.scripts]
creatorpulse = "creatorpulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["gspread.*", "yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
